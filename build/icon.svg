<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">KaiBot</title>
  <desc id="desc">A silver bot head with two dark eyes and a small mouth on a black rounded tile.</desc>

  <defs>
    <clipPath id="tile"><rect width="1024" height="1024" rx="224" /></clipPath>

    <!-- The head's metal, lit from the top left. -->
    <linearGradient id="metal" x1="22%" y1="6%" x2="80%" y2="96%">
      <stop offset="0"    stop-color="#FFFFFF" />
      <stop offset="0.30" stop-color="#E6E8EB" />
      <stop offset="0.62" stop-color="#B7BBC2" />
      <stop offset="0.85" stop-color="#848A94" />
      <stop offset="1"    stop-color="#5B616B" />
    </linearGradient>

    <!-- The ears sit outside the head's light, so they get their own brighter metal. -->
    <linearGradient id="ear" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0"   stop-color="#F4F5F7" />
      <stop offset="0.55" stop-color="#C9CDD3" />
      <stop offset="1"   stop-color="#8E949E" />
    </linearGradient>
  </defs>

  <g clip-path="url(#tile)">
    <rect width="1024" height="1024" fill="#070707" />

    <!-- Slightly larger than the tile's middle so the face still reads at 16 px. -->
    <g transform="translate(512 512) scale(1.1) translate(-512 -512)">
      <!-- Antenna and ears: the silhouette reads as a bot even at 16 px. -->
      <rect x="494" y="212" width="36" height="92" rx="18" fill="url(#ear)" />
      <circle cx="512" cy="188" r="50" fill="url(#ear)" />
      <circle cx="498" cy="172" r="14" fill="#FFFFFF" opacity="0.85" />
      <rect x="168" y="446" width="60" height="188" rx="30" fill="url(#ear)" />
      <rect x="796" y="446" width="60" height="188" rx="30" fill="url(#ear)" />

      <!-- Head. -->
      <rect x="216" y="292" width="592" height="512" rx="168" fill="url(#metal)" />

      <!-- Eyes and mouth are cut into the screen face. -->
      <rect x="358" y="440" width="104" height="136" rx="52" fill="#0B0B0C" />
      <rect x="562" y="440" width="104" height="136" rx="52" fill="#0B0B0C" />
      <rect x="432" y="636" width="160" height="44" rx="22" fill="#0B0B0C" />
    </g>
  </g>
</svg>
